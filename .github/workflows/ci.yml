name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            streamtimelens/pyproject.toml
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r apps/api/requirements.txt -e 'streamtimelens[dev]'
      - run: ruff check apps/api/app apps/api/tests streamtimelens/src streamtimelens/tests streamtimelens/scripts
      - name: Run Python tests
        shell: bash
        run: |
          set -o pipefail
          if ! PYTHONPATH=apps/api:src:third_party/TimeLens pytest -q apps/api/tests streamtimelens/tests 2>&1 | tee /tmp/pytest.log; then
            {
              echo "### Python test failure"
              echo '```text'
              tail -200 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure=$(tail -120 /tmp/pytest.log | python -c 'import sys; value=sys.stdin.read(); print(value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error title=Python test failure::$failure"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
